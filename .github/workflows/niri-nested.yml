name: UI screenshots (real niri)

# The same shell and shots as "UI screenshots", but the compositor is a real niri running nested in
# headless Sway, so blur and layer rules are drawn by niri itself. Experimental: runs when this
# workflow or ci/niri-nested.kdl changes (or by hand). Images go to the `ci-niri` branch.

on:
  push:
    branches-ignore: [ci-screenshots, ci-niri]
    paths: [ '.github/workflows/niri-nested.yml', 'ci/niri-nested.kdl' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niri-nested-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Capture screenshots
        id: capture
        shell: bash
        env:
          CAPTURE_LOG: ${{ runner.temp }}/capture.log
          CI_NIRI: "1"
        run: |
          nix-shell -p quickshell sway niri swaybg grim dbus libnotify imagemagick qrencode matugen "python3.withPackages (ps: [ ps.dbus-next ])" --run \
            "bash ci/run.sh" 2>&1 | tee "$CAPTURE_LOG"
      - name: Publish to ci-niri branch
        if: always()
        env:
          CAPTURE_LOG: ${{ runner.temp }}/capture.log
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          PUBLISH_BRANCH: ci-niri
        run: bash ci/publish.sh
