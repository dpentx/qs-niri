name: Nix checks

on:
  push:
    branches-ignore: [ci-screenshots]
  pull_request:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Parse
        run: |
          nix-instantiate --parse flake.nix >/dev/null
          nix-instantiate --parse nix/home-manager.nix >/dev/null
      - name: Home Manager module evaluates and generates shell.json
        run: nix-build ci/nix-check.nix --no-out-link
