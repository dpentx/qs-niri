name: Standalone flake
on:
  push:
    branches: [ tmp-standalone ]
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Lock and evaluate
        working-directory: ci-standalone
        run: |
          nix flake lock
          nix eval --raw .#homeConfigurations.manjaro.activationPackage.drvPath
          nix eval --raw .#homeConfigurations.manjaro.config.home.username
          nix eval --raw .#homeConfigurations.manjaro.config.programs.zsh.shellAliases.rebuild
