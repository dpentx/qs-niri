# Minimal Sway config for the headless screenshot pipeline.
# The output is created by the headless backend (WLR_BACKENDS=headless).
output * resolution 1920x1080 scale 1
# BG is rewritten by screenshots.sh to point at a generated gradient so that
# translucent shell surfaces have something realistic behind them.
output * bg #1b2230 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
